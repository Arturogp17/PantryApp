name: Desplegar API

on:
  push:
    branches: [main]
    paths:
      - "PantryManager.API/**"
      - ".github/workflows/api.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: PantryManager.API/PantryManager.API/PantryManager.API.csproj

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publicar
        run: dotnet publish "$PROJECT" -c Release -o "$RUNNER_TEMP/api"

      - name: Desplegar en App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/api
